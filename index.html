<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEJAK19 - SD NEGERI 19 PAGUYAMAN</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    @keyframes waveAnimation {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .wave-char {
      display: inline-block;
      animation: waveAnimation 1.6s ease-in-out infinite;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-[#F0F4F8] text-slate-800 overflow-hidden select-none">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // =========================================================================
    // [SUDAH TERHUBUNG] URL WEB APP GOOGLE APPS SCRIPT ANDA
    // =========================================================================
    const CENTRAL_GAS_API_URL = "https://script.google.com/macros/s/AKfycbxE_8EyzQV7vcpWhWiV6eUActg-9NaWNXOPu1Abee6WFk8fPVk1GJgND0WwNXBXH70/exec"; 

    // --- KOMPONEN IKON GLOBAL ---
    const Icon = ({ name, size = 24, className = '' }) => (
      <span className={`material-symbols-rounded ${className}`} style={{ fontSize: `${size}px`, lineHeight: 1 }}>
        {name}
      </span>
    );

    // --- MOCK DATA AWAL (Akan digunakan jika dijalankan di luar lingkungan Google Apps Script / Preview) ---
    const fallbackAlumni = [
      { id: 1, nama: "Ahmad Maulana", nisn: "0012345678", jk: "L", tglLahir: "2010-05-14", tmptLahir: "Gorontalo", alamat: "Jl. Raya Paguyaman No 12", tahunLulus: "2026", foto: null },
      { id: 2, nama: "Siti Aminah", nisn: "0012345679", jk: "P", tglLahir: "2010-08-21", tmptLahir: "Boalemo", alamat: "Desa Paguyaman Indah", tahunLulus: "2026", foto: null },
      { id: 3, nama: "Budi Santoso", nisn: "0012345680", jk: "L", tglLahir: "2009-12-01", tmptLahir: "Gorontalo", alamat: "Kecamatan Paguyaman, RT 01", tahunLulus: "2025", foto: null }
    ];

    // --- KOMPONEN ANIMASI TEKS OMBAK ---
    const WaveText = ({ text }) => {
      return (
        <div className="flex justify-center my-2 gap-1">
          {text.split('').map((char, index) => (
            <span
              key={index}
              className={`wave-char text-3xl font-black tracking-widest drop-shadow-md ${['1','9'].includes(char) ? 'text-white' : 'text-[#F5C542]'}`}
              style={{ animationDelay: `${index * 0.1}s` }}
            >
              {char}
            </span>
          ))}
        </div>
      );
    };

    // --- APLIKASI UTAMA ---
    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [isForgotPassword, setIsForgotPassword] = useState(false);

      // Status URL Database tersimpan di LocalStorage (Spesifik tiap browser sekolah)
      const [savedDbUrl, setSavedDbUrl] = useState(() => localStorage.getItem('JEJAK19_DB_URL') || '');

      // --- LOGIKA HASH ROUTING ---
      const [activeTabState, setActiveTabState] = useState(() => {
        const hash = window.location.hash.replace('#', '');
        return hash || 'dashboard';
      });

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '');
          if (hash) setActiveTabState(hash);
        };
        window.addEventListener('hashchange', handleHashChange);
        
        if (!window.location.hash) {
          window.location.hash = 'dashboard';
        }
        
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const setActiveTab = (tabId) => {
        window.location.hash = tabId;
        setActiveTabState(tabId);
      };
      
      const activeTab = activeTabState;
      // ---------------------------

      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [alumniData, setAlumniData] = useState(fallbackAlumni);
      const [isPrinting, setIsPrinting] = useState(false);
      const [printConfig, setPrintConfig] = useState({ tahun: '2026', format: 'lengkap' });

      const currentYear = new Date().getFullYear().toString();

      // Pengelompokan Data Alumni Berdasarkan Tahun Lulus secara Efisien
      const groupedByYear = useMemo(() => {
        return alumniData.reduce((acc, curr) => {
          acc[curr.tahunLulus] = (acc[curr.tahunLulus] || 0) + 1;
          return acc;
        }, {});
      }, [alumniData]);

      const years = Object.keys(groupedByYear).sort((a, b) => b - a);

      // --- FUNGSI ADAPTER KOMUNIKASI API PUSAT (Untuk Github Pages) ---
      const callBackend = (functionName, args = {}) => {
        return new Promise((resolve, reject) => {
          if (!CENTRAL_GAS_API_URL || CENTRAL_GAS_API_URL === "ISI_URL_WEB_APP_ANDA_DISINI") {
            if (functionName === 'getAlumniData') resolve(fallbackAlumni);
            else resolve({ success: true, message: 'Berhasil (Mode Simulasi)' });
            return;
          }

          // Fetch API menggunakan POST, menyertakan sheetUrl agar Backend tahu menyimpan di mana
          fetch(CENTRAL_GAS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ 
              action: functionName, 
              sheetUrl: savedDbUrl, 
              payload: args 
            })
          })
          .then(response => response.json())
          .then(resolve)
          .catch(() => {
            if (functionName === 'getAlumniData') resolve(fallbackAlumni);
            else reject(new Error('Gagal berkomunikasi dengan server Apps Script.'));
          });
        });
      };

      // Sinkronisasi Data Alumni saat Berhasil Login
      useEffect(() => {
        if (isLoggedIn && savedDbUrl) {
          setIsLoading(true);
          callBackend('getAlumniData')
            .then((data) => {
              setIsLoading(false);
              if (data && data.length > 0) setAlumniData(data);
            })
            .catch(() => setIsLoading(false));
        }
      }, [isLoggedIn, savedDbUrl]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setIsLoading(true);
        setLoginError('');

        // Jika DB belum diset, ijinkan masuk pakai admin/admin123 untuk menuju Pengaturan
        if (!savedDbUrl) {
          setTimeout(() => {
            setIsLoading(false);
            if (loginUser === 'admin' && loginPass === 'admin123') {
              setIsLoggedIn(true);
              setActiveTab('pengaturan'); // Langsung arahkan ke pengaturan
            } else {
              setLoginError('Database belum terhubung. Gunakan admin/admin123 untuk setup.');
            }
          }, 500);
          return;
        }

        callBackend('verifyLogin', { username: loginUser, password: loginPass })
          .then((res) => {
            setIsLoading(false);
            if (res.success) {
              setIsLoggedIn(true);
            } else {
              setLoginError(res.message);
            }
          })
          .catch(() => {
            setIsLoading(false);
            setLoginError('Koneksi login bermasalah. Periksa jaringan Anda.');
          });
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setLoginUser('');
        setLoginPass('');
        setActiveTab('dashboard');
      };

      const handlePrint = (tahun, format) => {
        setPrintConfig({ tahun, format });
        setIsPrinting(true);
        setTimeout(() => window.print(), 500);
      };

      useEffect(() => {
        const handleAfterPrint = () => setIsPrinting(false);
        window.addEventListener('afterprint', handleAfterPrint);
        return () => window.removeEventListener('afterprint', handleAfterPrint);
      }, []);

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': return <Dashboard alumniData={alumniData} groupedByYear={groupedByYear} currentYear={currentYear} setActiveTab={setActiveTab} savedDbUrl={savedDbUrl} />;
          case 'data': return <DataAlumni alumniData={alumniData} setAlumniData={setAlumniData} years={years} callBackend={callBackend} savedDbUrl={savedDbUrl} />;
          case 'angkatan': return <Angkatan groupedByYear={groupedByYear} setActiveTab={setActiveTab} handlePrint={handlePrint} />;
          case 'cetak': return <CetakPDF years={years} handlePrint={handlePrint} />;
          case 'statistik': return <Statistik alumniData={alumniData} groupedByYear={groupedByYear} />;
          case 'pengaturan': return <Pengaturan callBackend={callBackend} savedDbUrl={savedDbUrl} setSavedDbUrl={setSavedDbUrl} />;
          default: return <Dashboard savedDbUrl={savedDbUrl} />;
        }
      };

      if (isPrinting) return <PrintView alumniData={alumniData} config={printConfig} />;

      // --- LOGIN VIEW ---
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-[#061224] flex flex-col justify-center items-center p-4 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
            <div className="absolute bottom-0 right-0 w-96 h-96 bg-[#F5C542]/5 rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div>

            <div className="w-full max-w-md bg-[#0B1F3B]/90 backdrop-blur-md rounded-3xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.3)] overflow-hidden relative z-10 transition-all duration-300">
              <div className="p-8 text-center bg-black/30 border-b border-white/5">
                <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto shadow-xl overflow-hidden border-2 border-[#F5C542]">
                  <img src="https://i.ibb.co.com/jvcBCJfb/Logo-SDN-19-Paguyaman.png" alt="Logo SDN 19 Paguyaman" className="w-full h-full object-cover" />
                </div>
                <WaveText text="JEJAK19" />
                <p className="text-xs text-blue-200 font-black tracking-widest uppercase mt-1">SD NEGERI 19 PAGUYAMAN</p>
              </div>

              {!isForgotPassword ? (
                <form onSubmit={handleLoginSubmit} className="p-8 space-y-5">
                  <div className="text-center">
                    <h2 className="text-lg font-bold text-white">Arsip Digital Alumni</h2>
                    {!savedDbUrl ? (
                      <div className="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-red-500/20 text-red-400 text-xs font-bold rounded-full">
                         <Icon name="warning" size={14}/> Database Belum Terhubung
                      </div>
                    ) : (
                      <p className="text-emerald-400 text-xs mt-1 font-medium flex items-center justify-center gap-1">
                        <Icon name="check_circle" size={14}/> Database Terhubung
                      </p>
                    )}
                  </div>
                  {loginError && <div className="p-3 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl text-xs font-semibold text-center">{loginError}</div>}
                  <div className="space-y-4">
                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-300 uppercase tracking-wider">Username</label>
                      <input required type="text" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} placeholder="Username" className="w-full bg-black/20 border border-white/10 p-3.5 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-[#F5C542] text-sm transition-all" />
                    </div>
                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-300 uppercase tracking-wider">Password</label>
                      <input required type="password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} placeholder="••••••••" className="w-full bg-black/20 border border-white/10 p-3.5 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-[#F5C542] text-sm transition-all" />
                    </div>
                  </div>
                  <div className="flex justify-end">
                    <button type="button" onClick={() => setIsForgotPassword(true)} className="text-xs text-[#F5C542] hover:text-white font-medium transition-colors">Lupa Password?</button>
                  </div>
                  <button type="submit" disabled={isLoading} className="w-full py-4 bg-gradient-to-r from-[#F5C542] to-yellow-400 hover:from-yellow-400 hover:to-[#F5C542] text-[#0B1F3B] font-black tracking-wider rounded-xl shadow-lg transition-all hover:-translate-y-0.5 text-sm disabled:opacity-75">
                    {isLoading ? 'MEMVERIFIKASI...' : 'MASUK KE SISTEM'}
                  </button>
                </form>
              ) : (
                <div className="p-8 space-y-6">
                  <div className="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto border border-blue-500/30">
                     <Icon name="key" size={24} />
                  </div>
                  <div className="text-center">
                    <h2 className="text-lg font-bold text-white">Reset Akses Sistem</h2>
                    <p className="text-slate-400 text-xs mt-3 leading-relaxed">
                      Sistem JEJAK19 berjalan mandiri demi keamanan. Jika Anda lupa password admin, silakan hubungi <strong>Developer IT</strong> atau ganti langsung kata sandi melalui Sheet Pengaturan di Google Sheet sekolah.
                    </p>
                  </div>
                  <button onClick={() => setIsForgotPassword(false)} className="w-full py-4 bg-white/10 hover:bg-white/20 text-white font-bold tracking-wider rounded-xl transition-all flex items-center justify-center gap-2 text-sm border border-white/10">
                    <Icon name="arrow_back" size={16} /> KEMBALI KE LOGIN
                  </button>
                </div>
              )}
            </div>
            <p className="mt-8 text-xs text-slate-500 font-bold tracking-widest uppercase relative z-10">&copy; {new Date().getFullYear()} SD NEGERI 19 PAGUYAMAN</p>
          </div>
        );
      }

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'space_dashboard' },
        { id: 'data', label: 'Data Alumni', icon: 'group' },
        { id: 'angkatan', label: 'Angkatan Alumni', icon: 'school' },
        { id: 'cetak', label: 'Cetak Buku PDF', icon: 'print' },
        { id: 'statistik', label: 'Statistik', icon: 'bar_chart' },
        { id: 'pengaturan', label: 'Pengaturan', icon: 'settings' },
      ];

      return (
        <div className="flex h-screen bg-[#F0F4F8] overflow-hidden">
          <aside className="hidden md:flex flex-col w-72 bg-gradient-to-b from-[#0B1F3B] to-[#061224] text-white transition-all duration-300 z-20 shadow-2xl">
            <div className="p-8 flex items-center justify-center border-b border-white/5">
              <div className="text-center w-full">
                <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg overflow-hidden border-2 border-[#F5C542]">
                  <img src="https://i.ibb.co.com/jvcBCJfb/Logo-SDN-19-Paguyaman.png" alt="Logo" className="w-full h-full object-cover" />
                </div>
                <WaveText text="JEJAK19" />
                <p className="text-xs text-blue-200 mt-1 font-black tracking-wider opacity-80 uppercase leading-snug">SD NEGERI 19 PAGUYAMAN</p>
              </div>
            </div>
            
            <nav className="flex-1 overflow-y-auto py-6 custom-scrollbar">
              <ul className="space-y-2 px-4">
                {navItems.map((item) => (
                  <li key={item.id}>
                    <button onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-semibold transition-all duration-300 group ${activeTab === item.id ? 'bg-gradient-to-r from-[#F5C542] to-yellow-400 text-[#0B1F3B] shadow-lg translate-x-1' : 'text-slate-300 hover:bg-white/5 hover:text-white hover:translate-x-1'}`}>
                      <Icon name={item.icon} size={20} className={activeTab === item.id ? 'text-[#0B1F3B]' : 'text-slate-400 group-hover:text-[#F5C542]'} />
                      {item.label}
                      {activeTab === item.id && <Icon name="chevron_right" size={16} className="ml-auto opacity-50" />}
                    </button>
                  </li>
                ))}
              </ul>
            </nav>
            
            <div className="px-4 py-3 border-t border-white/5 bg-black/10">
              <button onClick={handleLogout} className="w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-all">
                <Icon name="logout" size={20} /> Keluar Sistem
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden relative">
            <header className="md:hidden flex items-center justify-between p-5 bg-white shadow-sm z-10 sticky top-0">
              <div className="flex items-center gap-3">
                 <div className="w-12 h-12 bg-white border-2 border-[#0B1F3B] rounded-full flex items-center justify-center overflow-hidden">
                    <img src="https://i.ibb.co.com/jvcBCJfb/Logo-SDN-19-Paguyaman.png" alt="Logo" className="w-full h-full object-cover" />
                 </div>
                 <h1 className="text-lg font-black text-[#0B1F3B] tracking-wider">JEJAK19</h1>
              </div>
              <button onClick={() => setIsMobileMenuOpen(true)} className="text-[#0B1F3B] p-2 bg-slate-100 rounded-lg">
                <Icon name="menu" size={20} />
              </button>
            </header>

            {isMobileMenuOpen && (
              <div className="fixed inset-0 bg-[#0B1F3B]/80 z-40 md:hidden backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)}>
                <aside className="w-72 h-full bg-[#0B1F3B] shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                  <div className="p-6 flex justify-between items-center border-b border-white/10">
                    <h1 className="text-xl font-black text-[#F5C542] tracking-wider">JEJAK19</h1>
                    <button onClick={() => setIsMobileMenuOpen(false)} className="text-white hover:text-red-400 bg-white/10 p-2 rounded-lg transition-colors">
                      <Icon name="close" size={20} />
                    </button>
                  </div>
                  <nav className="flex-1 overflow-y-auto py-6">
                    <ul className="space-y-2 px-4">
                      {navItems.map((item) => (
                        <li key={item.id}>
                          <button onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-semibold transition-all ${activeTab === item.id ? 'bg-[#F5C542] text-[#0B1F3B] shadow-lg' : 'text-slate-300 hover:bg-white/10'}`}>
                            <Icon name={item.icon} size={20} className={activeTab === item.id ? 'text-[#0B1F3B]' : 'text-slate-400'}/>
                            {item.label}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </nav>
                  <div className="p-4 border-t border-white/10">
                    <button onClick={handleLogout} className="w-full flex items-center gap-4 px-5 py-3.5 rounded-xl text-sm font-semibold text-red-400 hover:bg-red-500/10 transition-all">
                      <Icon name="logout" size={20} /> Keluar
                    </button>
                  </div>
                </aside>
              </div>
            )}

            <div className="flex-1 overflow-y-auto p-4 md:p-10 custom-scrollbar">
              <div className="max-w-7xl mx-auto pb-12">
                {renderContent()}
              </div>
            </div>
          </main>
        </div>
      );
    }

    function Dashboard({ alumniData, groupedByYear, currentYear, setActiveTab, savedDbUrl }) {
      const totalAlumni = alumniData.length;
      const totalAngkatan = Object.keys(groupedByYear).length;
      const alumniTahunIni = groupedByYear[currentYear] || 0;

      const stats = [
        { label: 'Total Alumni', value: totalAlumni, icon: 'group', gradient: 'from-blue-500 to-indigo-600' },
        { label: 'Jumlah Angkatan', value: totalAngkatan, icon: 'school', gradient: 'from-emerald-400 to-teal-500' },
        { label: `Lulusan ${currentYear}`, value: alumniTahunIni, icon: 'calendar_today', gradient: 'from-amber-400 to-orange-500' },
        { label: 'Sistem database', value: savedDbUrl ? 'Terkoneksi' : 'Lokal', icon: 'check_circle', gradient: savedDbUrl ? 'from-emerald-500 to-green-700' : 'from-slate-500 to-slate-700' },
      ];

      return (
        <div className="space-y-8 animate-fade-in">
          {!savedDbUrl && (
             <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl flex items-start gap-3">
                <Icon name="warning" className="text-red-500 mt-0.5" size={20} />
                <div>
                   <h3 className="text-red-800 font-bold text-sm">Database Belum Dikonfigurasi!</h3>
                   <p className="text-red-600 text-xs mt-1">Sistem berjalan dalam mode simulasi. Harap masuk ke menu <strong>Pengaturan</strong> lalu tautkan Link Google Sheet sekolah Anda agar data dapat disimpan permanen.</p>
                </div>
             </div>
          )}

          <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 bg-white p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.03)] border border-slate-100 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-[#F5C542]/10 to-transparent rounded-bl-full"></div>
            <div className="relative z-10">
              <h2 className="text-3xl font-black text-[#0B1F3B] mb-2 tracking-tight">Selamat Datang di JEJAK19</h2>
              <p className="text-slate-500 text-sm md:text-base font-medium max-w-xl">
                Arsip Digital Alumni SD NEGERI 19 PAGUYAMAN. Sistem rekapitulasi data kelulusan terpusat.
              </p>
            </div>
            <button onClick={() => setActiveTab('cetak')} className="relative z-10 bg-[#0B1F3B] hover:bg-[#061224] text-white px-6 py-3 rounded-xl flex items-center gap-3 shadow-lg shadow-slate-800/10 transition-all hover:-translate-y-1 font-semibold">
              <Icon name="print" size={18} className="text-[#F5C542]" /> Cetak Buku Alumni PDF
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            {stats.map((stat, idx) => (
              <div key={idx} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 relative overflow-hidden group">
                <div className="flex items-center gap-5 relative z-10">
                  <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${stat.gradient} flex items-center justify-center shrink-0`}>
                    <Icon name={stat.icon} size={24} className="text-white" />
                  </div>
                  <div>
                    <p className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">{stat.label}</p>
                    <h3 className="text-2xl font-black text-slate-800 tracking-tight">{stat.value}</h3>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div className="lg:col-span-2 bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
              <div className="flex justify-between items-center mb-8">
                <div>
                  <h3 className="text-xl font-bold text-[#0B1F3B]">Grafik Kelulusan</h3>
                  <p className="text-sm text-slate-500 mt-1">Total lulusan 3 tahun terakhir</p>
                </div>
                <button onClick={() => setActiveTab('statistik')} className="text-sm font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-lg transition-colors">Analitik Lengkap</button>
              </div>
              
              <div className="h-56 flex items-end justify-around gap-4 pt-4 border-b-2 border-slate-100 relative">
                {Object.entries(groupedByYear).sort(([a], [b]) => a - b).slice(-3).map(([year, count]) => {
                  const max = Math.max(...Object.values(groupedByYear));
                  const height = `${(count / max) * 100}%`;
                  return (
                    <div key={year} className="flex flex-col items-center w-full max-w-[80px] z-10 h-full justify-end">
                      <div className="w-full bg-[#0B1F3B] rounded-t-xl hover:bg-[#F5C542] transition-all duration-500 flex items-start justify-center pt-3 group relative cursor-pointer" style={{ height }}>
                        <span className="text-xs text-white font-bold opacity-0 group-hover:opacity-100 absolute -top-10 bg-slate-800 px-3 py-1.5 rounded-lg shadow-xl">{count} Siswa</span>
                      </div>
                      <span className="text-sm text-slate-600 mt-4 font-bold">{year}</span>
                    </div>
                  )
                })}
              </div>
            </div>

            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
              <h3 className="text-lg font-bold text-[#0B1F3B] mb-4">Pusat Informasi</h3>
              <div className="space-y-4">
                <div className="p-4 bg-blue-50 border border-blue-100 rounded-2xl">
                  <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2"><Icon name="cloud_done" size={18}/> SaaS Architecture</h4>
                  <p className="text-xs text-slate-600 mt-2 leading-relaxed">Aplikasi terpusat! Setiap sekolah cukup menyalin link Google Sheet mereka ke dalam pengaturan.</p>
                </div>
                <div className="p-4 bg-amber-50 border border-amber-100 rounded-2xl">
                  <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2"><Icon name="download" size={18}/> Cetak Profesional</h4>
                  <p className="text-xs text-slate-600 mt-2 leading-relaxed">Mendukung pembuatan dokumen arsip fisik A4 secara langsung dari browser.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function DataAlumni({ alumniData, setAlumniData, years, callBackend, savedDbUrl }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterYear, setFilterYear] = useState('');
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isEditMode, setIsEditMode] = useState(false);
      const [isViewOnly, setIsViewOnly] = useState(false);
      
      const [previewFoto, setPreviewFoto] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const currentYearNum = new Date().getFullYear();

      const [formData, setFormData] = useState({
        id: '', nama: '', nisn: '', jk: 'L', tmptLahir: '', tglLahir: '', alamat: '', tahunLulus: currentYearNum.toString(), foto: null
      });

      const filteredData = alumniData.filter(a => {
        const matchesSearch = a.nama.toLowerCase().includes(searchTerm.toLowerCase()) || (a.nisn && a.nisn.includes(searchTerm));
        const matchesYear = filterYear ? a.tahunLulus === filterYear : true;
        return matchesSearch && matchesYear;
      });

      const handleFotoUpload = (e) => {
        if (isViewOnly) return;
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setPreviewFoto(reader.result);
            setFormData({ ...formData, foto: reader.result });
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddClick = () => {
        if(!savedDbUrl) return alert("Harap tautkan URL Google Sheet di menu Pengaturan terlebih dahulu!");
        resetForm();
        setIsEditMode(false);
        setIsViewOnly(false);
        setIsModalOpen(true);
      };

      const handleViewClick = (alumni) => {
        setFormData(alumni);
        setPreviewFoto(alumni.foto);
        setIsEditMode(false);
        setIsViewOnly(true);
        setIsModalOpen(true);
      };

      const handleEditClick = (alumni) => {
        if(!savedDbUrl) return alert("Harap tautkan URL Google Sheet di menu Pengaturan terlebih dahulu!");
        setFormData(alumni);
        setPreviewFoto(alumni.foto);
        setIsEditMode(true);
        setIsViewOnly(false);
        setIsModalOpen(true);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        if (isEditMode) {
          callBackend('updateAlumniData', formData)
            .then((res) => {
              setIsSubmitting(false);
              if (res.success) {
                setAlumniData(alumniData.map(a => a.id === formData.id ? formData : a));
                setIsModalOpen(false);
                resetForm();
              } else {
                alert(res.message);
              }
            })
            .catch((err) => {
              setIsSubmitting(false);
              alert(err.message || 'Gagal menyimpan perubahan.');
            });
        } else {
          const newAlumni = { ...formData, id: Date.now() };
          callBackend('simpanAlumniData', newAlumni)
            .then((res) => {
              setIsSubmitting(false);
              if (res.success) {
                setAlumniData([newAlumni, ...alumniData]);
                setIsModalOpen(false);
                resetForm();
              } else {
                alert("Gagal menambahkan data.");
              }
            })
            .catch((err) => {
              setIsSubmitting(false);
              alert(err.message || 'Gagal menyimpan data.');
            });
        }
      };

      const resetForm = () => {
        setFormData({ id: '', nama: '', nisn: '', jk: 'L', tmptLahir: '', tglLahir: '', alamat: '', tahunLulus: currentYearNum.toString(), foto: null });
        setPreviewFoto(null);
      };

      const handleDelete = (id) => {
        if(!savedDbUrl) return alert("Harap tautkan URL Google Sheet di menu Pengaturan terlebih dahulu!");
        if (confirm('Yakin ingin menghapus data alumni ini secara permanen?')) {
          callBackend('hapusAlumniData', id)
            .then((res) => {
              if (res.success) {
                setAlumniData(alumniData.filter(a => a.id !== id));
              } else {
                alert(res.message);
              }
            })
            .catch((err) => {
              alert(err.message || 'Gagal menghapus data.');
            });
        }
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-2">
            <div>
              <h2 className="text-3xl font-black text-[#0B1F3B] tracking-tight">Database Alumni</h2>
              <p className="text-slate-500 text-sm mt-1">Kelola arsip profil dan pas foto kelulusan alumni.</p>
            </div>
            <button 
              onClick={handleAddClick}
              className={`${savedDbUrl ? 'bg-[#0B1F3B] hover:bg-[#F5C542] hover:text-[#0B1F3B]' : 'bg-gray-400 cursor-not-allowed'} text-white px-5 py-3 rounded-xl flex items-center gap-2 shadow-lg transition-all font-bold hover:-translate-y-1`}
            >
              <Icon name="add" size={18} /> Tambah Data Alumni
            </button>
          </div>

          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col h-[calc(100vh-220px)] min-h-[500px] overflow-hidden">
            <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row gap-4 justify-between bg-slate-50/50">
              <div className="relative w-full sm:w-80">
                <Icon name="search" size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                <input type="text" placeholder="Cari berdasarkan nama atau NISN..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-[#0B1F3B] focus:ring-2 focus:ring-[#0B1F3B]/20 text-sm font-medium transition-all shadow-sm" />
              </div>
              <div className="flex items-center gap-3">
                <div className="bg-white border border-slate-200 rounded-xl flex items-center px-4 shadow-sm">
                  <Icon name="filter_alt" size={16} className="text-slate-400 mr-2" />
                  <select value={filterYear} onChange={(e) => setFilterYear(e.target.value)} className="py-2.5 bg-transparent text-sm font-medium focus:outline-none text-slate-700 cursor-pointer">
                    <option value="">Semua Angkatan</option>
                    {years.map(y => <option key={y} value={y}>Angkatan {y}</option>)}
                  </select>
                </div>
              </div>
            </div>

            <div className="flex-1 overflow-auto custom-scrollbar bg-white">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="sticky top-0 z-10 bg-slate-50/90 backdrop-blur-md text-slate-600 font-bold uppercase text-xs">
                  <tr className="border-b border-slate-100">
                    <th className="px-6 py-4">Profil Alumni</th>
                    <th className="px-6 py-4">NISN</th>
                    <th className="px-6 py-4">Kelamin</th>
                    <th className="px-6 py-4">Tempat, Tgl Lahir</th>
                    <th className="px-6 py-4">Angkatan</th>
                    <th className="px-6 py-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filteredData.length > 0 ? filteredData.map((alumni) => (
                    <tr key={alumni.id} className="hover:bg-blue-50/40 transition-colors group">
                      <td className="px-6 py-4">
                        <div className="flex items-center gap-4">
                          {alumni.foto ? (
                            <img src={alumni.foto} alt={alumni.nama} className="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm" />
                          ) : (
                            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-slate-200 to-slate-300 flex items-center justify-center text-slate-600 font-bold border-2 border-white shadow-sm">
                              {alumni.nama.charAt(0)}
                            </div>
                          )}
                          <div>
                            <div className="font-bold text-slate-800">{alumni.nama}</div>
                            <div className="text-xs text-slate-500 mt-0.5 max-w-[200px] truncate">{alumni.alamat || 'Alamat belum diisi'}</div>
                          </div>
                        </div>
                      </td>
                      <td className="px-6 py-4 font-medium text-slate-600">{alumni.nisn || '-'}</td>
                      <td className="px-6 py-4">
                         <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${alumni.jk === 'L' ? 'bg-blue-100 text-blue-700' : 'bg-pink-100 text-pink-700'}`}>
                            {alumni.jk === 'L' ? 'Laki-laki' : 'Perempuan'}
                         </span>
                      </td>
                      <td className="px-6 py-4 text-slate-600">
                         {alumni.tmptLahir ? `${alumni.tmptLahir}, ` : ''}{alumni.tglLahir || '-'}
                      </td>
                      <td className="px-6 py-4">
                        <span className="px-3 py-1 bg-slate-100 border border-slate-200 text-slate-700 rounded-lg text-xs font-bold">{alumni.tahunLulus}</span>
                      </td>
                      <td className="px-6 py-4 text-center">
                        <div className="flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                          <button onClick={() => handleViewClick(alumni)} className="p-2 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors"><Icon name="visibility" size={16} /></button>
                          <button onClick={() => handleEditClick(alumni)} className="p-2 text-amber-600 hover:bg-amber-100 rounded-lg transition-colors"><Icon name="edit" size={16} /></button>
                          <button onClick={() => handleDelete(alumni.id)} className="p-2 text-red-600 hover:bg-red-100 rounded-lg transition-colors"><Icon name="delete" size={16} /></button>
                        </div>
                      </td>
                    </tr>
                  )) : (
                    <tr>
                      <td colSpan="6" className="px-6 py-16 text-center">
                        <p className="text-slate-400 text-sm">Data alumni tidak ditemukan.</p>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setIsModalOpen(false)}></div>
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl relative z-10 flex flex-col max-h-[90vh] overflow-hidden transform animate-scale-up">
                <div className="px-8 py-5 bg-gradient-to-r from-[#0B1F3B] to-[#061224] text-white flex justify-between items-center shrink-0 border-b-4 border-[#F5C542]">
                  <div>
                    <h3 className="font-black text-xl">
                      {isViewOnly ? 'Detail Data Alumni' : (isEditMode ? 'Edit Data Alumni' : 'Registrasi Profil Alumni')}
                    </h3>
                    <p className="text-blue-200 text-xs font-medium mt-1">
                      {isViewOnly ? 'Menampilkan arsip data secara read-only.' : 'Pastikan data telah disiapkan dengan benar.'}
                    </p>
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-white/60 hover:text-white bg-white/10 p-2 rounded-xl"><Icon name="close" size={20}/></button>
                </div>
                
                <div className="overflow-y-auto p-8 flex-1 custom-scrollbar">
                  <form id="alumniForm" onSubmit={handleSubmit} className="flex flex-col md:flex-row gap-10">
                    <div className="w-full md:w-1/3 flex flex-col gap-3">
                       <label className="text-sm font-bold text-slate-700">Pas Foto</label>
                       <div className="relative group">
                         <div className={`w-full aspect-[3/4] rounded-2xl border-2 border-dashed flex flex-col items-center justify-center overflow-hidden transition-all duration-300 ${previewFoto ? 'border-[#0B1F3B] bg-slate-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100 hover:border-blue-400'}`}>
                           {previewFoto ? (
                             <>
                               <img src={previewFoto} alt="Preview" className="w-full h-full object-cover" />
                               {!isViewOnly && (
                                 <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                   <span className="text-white font-semibold text-sm flex items-center gap-2"><Icon name="edit" size={16}/> Ubah Foto</span>
                                 </div>
                               )}
                             </>
                           ) : (
                             <div className="text-center p-6 flex flex-col items-center">
                               <Icon name="photo_camera" size={32} className="text-slate-400 mb-2" />
                               <p className="text-xs font-bold text-slate-700">{isViewOnly ? 'Tidak ada foto' : 'Pilih Pas Foto'}</p>
                             </div>
                           )}
                           {!isViewOnly && <input type="file" accept="image/*" onChange={handleFotoUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />}
                         </div>
                       </div>
                    </div>

                    <div className="w-full md:w-2/3 flex flex-col gap-5">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div className="space-y-1.5 md:col-span-2">
                          <label className="text-sm font-bold text-slate-700">Nama Lengkap *</label>
                          <input required disabled={isViewOnly} type="text" placeholder="Masukkan nama" value={formData.nama} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm disabled:opacity-75 disabled:cursor-not-allowed" />
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-sm font-bold text-slate-700">NISN</label>
                          <input disabled={isViewOnly} type="text" placeholder="NISN" value={formData.nisn} onChange={e=>setFormData({...formData, nisn: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm disabled:opacity-75 disabled:cursor-not-allowed" />
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-sm font-bold text-slate-700">Jenis Kelamin *</label>
                          <select required disabled={isViewOnly} value={formData.jk} onChange={e=>setFormData({...formData, jk: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm font-medium disabled:opacity-75 disabled:cursor-not-allowed">
                            <option value="L">Laki-laki (L)</option>
                            <option value="P">Perempuan (P)</option>
                          </select>
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-sm font-bold text-slate-700">Tempat Lahir</label>
                          <input disabled={isViewOnly} type="text" placeholder="Kota" value={formData.tmptLahir} onChange={e=>setFormData({...formData, tmptLahir: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm disabled:opacity-75 disabled:cursor-not-allowed" />
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-sm font-bold text-slate-700">Tanggal Lahir</label>
                          <input disabled={isViewOnly} type="date" value={formData.tglLahir} onChange={e=>setFormData({...formData, tglLahir: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm disabled:opacity-75 disabled:cursor-not-allowed" />
                        </div>
                        <div className="space-y-1.5 md:col-span-2">
                          <label className="text-sm font-bold text-slate-700">Tahun Lulus (Angkatan) *</label>
                          <select required disabled={isViewOnly} value={formData.tahunLulus} onChange={e=>setFormData({...formData, tahunLulus: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm font-bold disabled:opacity-75 disabled:cursor-not-allowed">
                             <option value="">-- Pilih Tahun --</option>
                             {Array.from({length: 30}, (_, i) => currentYearNum + 5 - i).map(y => (
                               <option key={y} value={y}>{y}</option>
                             ))}
                          </select>
                        </div>
                      </div>
                      <div className="space-y-1.5">
                        <label className="text-sm font-bold text-slate-700">Alamat Lengkap</label>
                        <textarea disabled={isViewOnly} rows="2" placeholder="Alamat rumah..." value={formData.alamat} onChange={e=>setFormData({...formData, alamat: e.target.value})} className="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:bg-white focus:outline-none focus:border-[#0B1F3B] text-sm disabled:opacity-75 disabled:cursor-not-allowed"></textarea>
                      </div>
                    </div>
                  </form>
                </div>
                
                <div className="px-8 py-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 shrink-0">
                  <button onClick={() => setIsModalOpen(false)} className="px-6 py-2.5 text-sm font-bold text-slate-600 bg-white border border-slate-200 rounded-xl hover:bg-slate-100 shadow-sm">
                    {isViewOnly ? 'Tutup' : 'Batal'}
                  </button>
                  {!isViewOnly && (
                    <button type="submit" form="alumniForm" disabled={isSubmitting} className="px-6 py-2.5 text-sm font-bold text-[#0B1F3B] bg-[#F5C542] rounded-xl hover:bg-yellow-400 hover:-translate-y-0.5 transition-all shadow-md disabled:opacity-75">
                      {isSubmitting ? 'Menyimpan...' : (isEditMode ? 'Simpan Perubahan' : 'Simpan Data')}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Angkatan({ groupedByYear, setActiveTab, handlePrint }) {
      const years = Object.keys(groupedByYear).sort((a, b) => b - a);
      return (
        <div className="space-y-8 animate-fade-in">
          <div>
            <h2 className="text-3xl font-black text-[#0B1F3B] tracking-tight">Katalog Angkatan</h2>
            <p className="text-slate-500 text-sm mt-1">Daftar lulusan alumni dikelompokkan per tahun ajaran.</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            {years.map(year => (
              <div key={year} className="bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-lg transition-all duration-300 flex flex-col overflow-hidden group hover:-translate-y-1">
                <div className="p-8 flex-1 flex flex-col items-center justify-center text-center relative bg-gradient-to-br from-white to-slate-50">
                  <div className="text-6xl font-black text-[#0B1F3B] tracking-tighter mb-4">{year}</div>
                  <div className="px-4 py-2 bg-blue-50 border border-blue-100 text-blue-700 rounded-xl text-xs font-bold">
                    {groupedByYear[year]} Alumni Terdaftar
                  </div>
                </div>
                <div className="grid grid-cols-2 border-t border-slate-100 bg-slate-50">
                  <button onClick={() => setActiveTab('data')} className="py-4 text-xs font-bold text-slate-600 hover:text-blue-700 hover:bg-blue-100 flex items-center justify-center gap-2 border-r border-slate-100">
                    <Icon name="visibility" size={16} /> Lihat Data
                  </button>
                  <button onClick={() => handlePrint(year, 'lengkap')} className="py-4 text-xs font-bold text-slate-600 hover:text-[#0B1F3B] hover:bg-[#F5C542]/20 flex items-center justify-center gap-2">
                    <Icon name="print" size={16} /> Cetak PDF
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CetakPDF({ years, handlePrint }) {
      const [selectedYear, setSelectedYear] = useState(years[0] || new Date().getFullYear().toString());
      const [format, setFormat] = useState('lengkap');
      return (
        <div className="space-y-8 animate-fade-in max-w-3xl mx-auto">
          <div className="text-center mb-10 pt-4">
            <div className="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-blue-100 text-blue-700 mb-4 shadow-sm border border-blue-100">
              <Icon name="print" size={36} />
            </div>
            <h2 className="text-3xl font-black text-[#0B1F3B] tracking-tight">Cetak Buku Alumni (PDF)</h2>
            <p className="text-slate-500 text-sm mt-3 leading-relaxed">Sistem engine cetak canggih akan membuat layout halaman berukuran A4 yang rapi dan siap diprint.</p>
          </div>

          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 md:p-10">
            <div className="space-y-8">
              <div className="space-y-3">
                <label className="text-sm font-black text-slate-700 uppercase">1. Pilih Tahun Angkatan</label>
                <select value={selectedYear} onChange={(e) => setSelectedYear(e.target.value)} className="w-full border-2 border-slate-200 rounded-2xl p-4 text-lg font-bold text-[#0B1F3B] bg-slate-50 focus:outline-none">
                  {years.map(y => <option key={y} value={y}>Angkatan Lulusan Tahun {y}</option>)}
                </select>
              </div>

              <div className="space-y-3">
                <label className="text-sm font-black text-slate-700 uppercase">2. Format Laporan</label>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <label className={`border-2 rounded-2xl p-5 cursor-pointer transition-all ${format === 'lengkap' ? 'border-[#0B1F3B] bg-[#0B1F3B]/5' : 'border-slate-200'}`}>
                    <div className="flex items-center gap-3 mb-2">
                      <input type="radio" checked={format === 'lengkap'} onChange={() => setFormat('lengkap')} className="w-4 h-4 text-blue-600" />
                      <span className="font-bold text-[#0B1F3B]">Buku Lengkap (Dengan Foto)</span>
                    </div>
                    <p className="text-xs text-slate-500 pl-7 leading-relaxed">Menampilkan halaman cover depan megah, dan profil rinci alumni lengkap dengan foto 3x4.</p>
                  </label>

                  <label className={`border-2 rounded-2xl p-5 cursor-pointer transition-all ${format === 'ringkas' ? 'border-[#0B1F3B] bg-[#0B1F3B]/5' : 'border-slate-200'}`}>
                    <div className="flex items-center gap-3 mb-2">
                      <input type="radio" checked={format === 'ringkas'} onChange={() => setFormat('ringkas')} className="w-4 h-4 text-blue-600" />
                      <span className="font-bold text-[#0B1F3B]">Daftar Ringkas (Tabel)</span>
                    </div>
                    <p className="text-xs text-slate-500 pl-7 leading-relaxed">Format rekap data alumni dalam bentuk baris tabel. Sangat menghemat kertas saat dicetak.</p>
                  </label>
                </div>
              </div>

              <button onClick={() => handlePrint(selectedYear, format)} className="w-full py-5 mt-4 bg-gradient-to-r from-[#0B1F3B] to-[#061224] text-[#F5C542] rounded-2xl font-black text-lg tracking-wider flex items-center justify-center gap-3 transition-all shadow-lg hover:-translate-y-1">
                <Icon name="print" size={24} /> GENERATE PDF SEKARANG
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Statistik({ alumniData, groupedByYear }) {
      const totalLaki = alumniData.filter(a => a.jk === 'L').length;
      const totalPr = alumniData.filter(a => a.jk === 'P').length;
      const total = alumniData.length;
      return (
        <div className="space-y-8 animate-fade-in">
          <div>
            <h2 className="text-3xl font-black text-[#0B1F3B] tracking-tight">Statistik Data Alumni</h2>
            <p className="text-slate-500 text-sm mt-1">Diagram data kependudukan dan persentase kelulusan.</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
              <h3 className="text-lg font-bold text-[#0B1F3B] mb-8">Rasio Jenis Kelamin</h3>
              <div className="flex items-center justify-center gap-12 mb-10">
                <div className="text-center">
                  <div className="text-4xl font-black text-blue-500">{Math.round((totalLaki/total)*100) || 0}%</div>
                  <p className="text-xs font-bold text-slate-500 mt-2">Laki-laki ({totalLaki})</p>
                </div>
                <div className="w-px h-16 bg-slate-200"></div>
                <div className="text-center">
                  <div className="text-4xl font-black text-pink-500">{Math.round((totalPr/total)*100) || 0}%</div>
                  <p className="text-xs font-bold text-slate-500 mt-2">Perempuan ({totalPr})</p>
                </div>
              </div>
              <div className="h-6 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                <div className="bg-blue-500 h-full transition-all" style={{ width: `${(totalLaki/total)*100}%` }}></div>
                <div className="bg-pink-500 h-full transition-all" style={{ width: `${(totalPr/total)*100}%` }}></div>
              </div>
            </div>

            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-center items-center text-center">
               <div className="w-16 h-16 bg-amber-50 text-amber-500 rounded-full mb-6 flex items-center justify-center shadow-inner">
                 <Icon name="bar_chart" size={32} />
               </div>
               <h3 className="text-slate-400 font-bold uppercase text-xs mb-2">Total Seluruh Alumni</h3>
               <div className="text-6xl font-black text-[#0B1F3B]">{total} Lulusan</div>
            </div>
          </div>
        </div>
      );
    }

    function Pengaturan({ callBackend, savedDbUrl, setSavedDbUrl }) {
      const [oldPass, setOldPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [msg, setMsg] = useState({ type: '', text: '' });
      const [isSaving, setIsSaving] = useState(false);

      const [dbUrlInput, setDbUrlInput] = useState(savedDbUrl || '');
      const [isDbSaving, setIsDbSaving] = useState(false);
      const [dbMsg, setDbMsg] = useState({ type: '', text: '' });

      const handleUpdatePassword = (e) => {
        e.preventDefault();
        setIsSaving(true);
        setMsg({ type: '', text: '' });

        callBackend('ubahPassword', { oldPass, newPass })
          .then((res) => {
            setIsSaving(false);
            setMsg({ type: res.success ? 'success' : 'error', text: res.message });
            if (res.success) { setOldPass(''); setNewPass(''); }
          })
          .catch(() => {
            setIsSaving(false);
            setMsg({ type: 'error', text: 'Gagal memperbarui kata sandi.' });
          });
      };

      const handleUpdateDb = (e) => {
        e.preventDefault();
        setIsDbSaving(true);
        setDbMsg({ type: '', text: '' });

        callBackend('testKoneksi')
          .then((res) => {
            setIsDbSaving(false);
            if(res.success){
               localStorage.setItem('JEJAK19_DB_URL', dbUrlInput);
               setSavedDbUrl(dbUrlInput);
               setDbMsg({ type: 'success', text: 'Database berhasil terhubung dan tersimpan di browser!' });
            } else {
               setDbMsg({ type: 'error', text: res.message || 'Gagal terhubung ke Google Sheet' });
            }
          })
          .catch(() => {
            setIsDbSaving(false);
            setDbMsg({ type: 'error', text: 'Koneksi ke API Server gagal.' });
          });
      };

      return (
        <div className="space-y-8 animate-fade-in max-w-4xl">
          <div>
            <h2 className="text-3xl font-black text-[#0B1F3B] tracking-tight">Pengaturan Sistem</h2>
            <p className="text-slate-500 text-sm mt-1">Konfigurasi database penyimpanan, keamanan, dan profil instansi.</p>
          </div>

          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 divide-y divide-slate-100 overflow-hidden">
            
            {/* 1. KONEKSI DATABASE GOOGLE SHEET */}
            <div className="p-8 space-y-6 bg-blue-50/30">
              <div className="flex items-center gap-3 border-b border-blue-200 pb-4">
                 <Icon name="database" className="text-[#0B1F3B]" size={24}/>
                 <h3 className="font-black text-xl text-slate-800">1. Koneksi Database (Google Sheet Sekolah)</h3>
              </div>
              <div className="space-y-2">
                <p className="text-sm text-slate-600 mb-4 leading-relaxed">Masukkan link/URL Spreadsheet kosong milik sekolah. Sistem ini akan otomatis membuat tabel format database di dalamnya. <br/><span className="text-red-500 font-semibold">*Pastikan status share Google Sheet tersebut adalah "Anyone with the link can edit".</span></p>
                <form onSubmit={handleUpdateDb} className="flex flex-col sm:flex-row gap-4">
                   <input required type="url" value={dbUrlInput} onChange={(e)=>setDbUrlInput(e.target.value)} className="flex-1 bg-white border border-blue-200 p-3.5 rounded-xl text-sm font-medium outline-none focus:border-[#0B1F3B] focus:ring-4 focus:ring-[#0B1F3B]/10 transition-all" placeholder="https://docs.google.com/spreadsheets/d/..." />
                   <button type="submit" disabled={isDbSaving} className="bg-[#0B1F3B] text-[#F5C542] px-8 py-3.5 rounded-xl text-sm font-bold shadow-md hover:-translate-y-0.5 transition-all whitespace-nowrap disabled:opacity-70">
                     {isDbSaving ? 'Menyambungkan...' : 'Tautkan Database'}
                   </button>
                </form>
                {dbMsg.text && (
                   <div className={`p-3 text-sm font-bold rounded-xl mt-3 inline-block ${dbMsg.type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                     {dbMsg.text}
                   </div>
                )}
              </div>
            </div>

            {/* 2. PASSWORD */}
            <div className="p-8 space-y-6">
              <div className="flex items-center gap-3 border-b border-slate-200 pb-4">
                 <Icon name="lock" className="text-red-500" size={24}/>
                 <h3 className="font-black text-xl text-slate-800">2. Ubah Password Keamanan</h3>
              </div>
              
              <form onSubmit={handleUpdatePassword} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                 {msg.text && (
                   <div className={`md:col-span-2 p-3 text-sm font-bold rounded-xl ${msg.type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                     {msg.text}
                   </div>
                 )}
                 <div className="space-y-2">
                   <label className="text-xs font-bold text-slate-500 uppercase">Password Lama</label>
                   <input required type="password" value={oldPass} onChange={(e)=>setOldPass(e.target.value)} className="w-full bg-white border border-slate-200 p-3.5 rounded-xl text-sm" placeholder="Masukkan password lama" />
                 </div>
                 <div className="space-y-2">
                   <label className="text-xs font-bold text-slate-500 uppercase">Password Baru</label>
                   <input required type="password" value={newPass} onChange={(e)=>setNewPass(e.target.value)} className="w-full bg-white border border-slate-200 p-3.5 rounded-xl text-sm" placeholder="Masukkan password baru" />
                 </div>
                 <div className="md:col-span-2 flex justify-end">
                   <button type="submit" disabled={isSaving} className="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2">
                      <Icon name="key" size={16} /> {isSaving ? 'Menyimpan...' : 'Perbarui Password'}
                   </button>
                 </div>
              </form>
            </div>

            {/* 3. PROFIL INSTANSI */}
            <div className="p-8 space-y-6">
              <div className="flex items-center gap-3 border-b border-slate-100 pb-4">
                 <Icon name="settings" className="text-[#0B1F3B]" size={24}/>
                 <h3 className="font-black text-xl text-slate-800">3. Profil Instansi & Validasi Cetak</h3>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="space-y-2">
                  <label className="text-xs font-bold text-slate-500 uppercase">Nama Kepala Sekolah</label>
                  <input type="text" defaultValue="Drs. H. Abdullah, M.Pd" className="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-sm font-bold" />
                </div>
                <div className="space-y-2">
                  <label className="text-xs font-bold text-slate-500 uppercase">NIP Kepala Sekolah</label>
                  <input type="text" defaultValue="19700101 199512 1 001" className="w-full bg-slate-50 border border-slate-200 p-3.5 rounded-xl text-sm font-bold" />
                </div>
              </div>
            </div>
            
            <div className="p-6 bg-slate-50 flex justify-end">
               <button className="bg-gradient-to-r from-[#0B1F3B] to-blue-900 text-[#F5C542] px-8 py-3 rounded-xl shadow-lg shadow-blue-900/20 text-sm font-bold hover:shadow-xl hover:-translate-y-1 transition-all">Simpan Profil</button>
            </div>
          </div>
        </div>
      );
    }

    function PrintView({ alumniData, config }) {
      const dataToPrint = alumniData.filter(a => a.tahunLulus === config.tahun).sort((a,b) => a.nama.localeCompare(b.nama));
      return (
        <div className="min-h-screen bg-white text-black p-8 md:p-16 max-w-[21cm] mx-auto print:p-0 print:m-0 print:max-w-none font-sans">
          <style>{`
            @media print {
              @page { size: A4 portrait; margin: 1.5cm; }
              body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
              .page-break { page-break-before: always; }
              .no-break { break-inside: avoid; page-break-inside: avoid; }
            }
          `}</style>
          
          <div className="h-[25cm] flex flex-col items-center justify-center text-center border-[12px] border-double border-[#0B1F3B] p-12 relative overflow-hidden print:h-[26cm] bg-[#FAFAFA]">
             <div className="absolute top-8 left-8 w-16 h-16 border-t-8 border-l-8 border-[#F5C542]"></div>
             <div className="absolute top-8 right-8 w-16 h-16 border-t-8 border-r-8 border-[#F5C542]"></div>
             <div className="absolute bottom-8 left-8 w-16 h-16 border-b-8 border-l-8 border-[#F5C542]"></div>
             <div className="absolute bottom-8 right-8 w-16 h-16 border-b-8 border-r-8 border-[#F5C542]"></div>

             <div className="w-48 h-48 mb-10 bg-white rounded-full flex items-center justify-center border-4 border-[#0B1F3B] outline outline-4 outline-offset-4 outline-[#F5C542] shadow-2xl overflow-hidden">
               <img src="https://i.ibb.co.com/jvcBCJfb/Logo-SDN-19-Paguyaman.png" alt="Logo SDN 19 Paguyaman" className="w-full h-full object-cover" />
             </div>
             
             <h2 className="text-xl font-bold text-gray-500 tracking-[0.3em] uppercase mb-4">Dokumen Arsip Resmi</h2>
             <h1 className="text-5xl font-black uppercase tracking-widest text-[#0B1F3B] mb-2 drop-shadow-md">Buku Alumni</h1>
             <h2 className="text-2xl font-bold text-[#F5C542] tracking-widest mb-10 bg-[#0B1F3B] text-white px-8 py-2 rounded-full">SD NEGERI 19 PAGUYAMAN</h2>
             <div className="w-32 h-1.5 bg-[#F5C542] mb-10 rounded-full"></div>
             
             <div className="bg-white p-8 border-2 border-dashed border-gray-300 w-full max-w-md shadow-sm">
                <div className="text-xl text-gray-500 font-bold tracking-widest mb-2 uppercase">Angkatan Tahun Lulus</div>
                <div className="text-7xl font-black text-[#0B1F3B] drop-shadow-sm">{config.tahun}</div>
             </div>
             <p className="mt-auto text-xs text-gray-400 font-bold tracking-[0.2em] uppercase">JEJAK19 - DIGITAL ALUMNI ARCHIVE SYSTEM</p>
          </div>

          <div className="page-break"></div>

          <div className="pt-8">
            <div className="text-center mb-10 pb-6 border-b-4 border-[#0B1F3B]">
              <h2 className="text-3xl font-black uppercase text-[#0B1F3B] tracking-wider mb-2">Buku Alumni Angkatan {config.tahun}</h2>
              <p className="text-base text-gray-600 font-bold uppercase tracking-widest">SD Negeri 19 Paguyaman</p>
            </div>

            {config.format === 'lengkap' ? (
              <div className="grid grid-cols-2 gap-x-8 gap-y-6">
                {dataToPrint.map((alumni, i) => (
                  <div key={i} className="no-break border-2 border-gray-200 rounded-2xl p-5 flex gap-5 bg-white shadow-sm relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-16 h-16 bg-gray-50 rounded-bl-full -z-0"></div>
                    <div className="w-24 h-32 bg-gray-100 rounded-xl border-2 border-gray-200 flex flex-col items-center justify-center shrink-0 overflow-hidden relative z-10 shadow-inner">
                      {alumni.foto ? <img src={alumni.foto} alt="Foto" className="w-full h-full object-cover" /> : <><Icon name="person" size={36} className="text-gray-300 mb-2" /><span className="text-[10px] text-gray-400 font-medium uppercase">3x4</span></>}
                    </div>
                    <div className="text-sm space-y-1.5 flex-1 relative z-10">
                      <h3 className="font-black text-lg text-[#0B1F3B] uppercase mb-2 border-b border-gray-200 pb-1">{alumni.nama}</h3>
                      <div className="grid grid-cols-[60px_10px_1fr] text-xs"><span className="text-gray-500 font-bold">NISN</span><span className="text-gray-400">:</span><span className="font-bold text-gray-800">{alumni.nisn || '-'}</span></div>
                      <div className="grid grid-cols-[60px_10px_1fr] text-xs"><span className="text-gray-500 font-bold">L/P</span><span className="text-gray-400">:</span><span className="font-medium text-gray-800">{alumni.jk === 'L' ? 'Laki-Laki' : 'Perempuan'}</span></div>
                      <div className="grid grid-cols-[60px_10px_1fr] text-xs"><span className="text-gray-500 font-bold">TTL</span><span className="text-gray-400">:</span><span className="font-medium text-gray-800">{alumni.tmptLahir}, {alumni.tglLahir}</span></div>
                      <div className="grid grid-cols-[60px_10px_1fr] text-xs"><span className="text-gray-500 font-bold">Alamat</span><span className="text-gray-400">:</span><span className="font-medium text-gray-800 leading-tight">{alumni.alamat || '-'}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="rounded-xl overflow-hidden border-2 border-[#0B1F3B]">
                 <table className="w-full text-left border-collapse text-sm">
                   <thead className="bg-[#0B1F3B] text-white">
                     <tr>
                       <th className="p-3 text-center w-12 font-bold border-r border-white/20">No</th>
                       <th className="p-3 font-bold border-r border-white/20">Nama Lengkap</th>
                       <th className="p-3 text-center w-28 font-bold border-r border-white/20">NISN</th>
                       <th className="p-3 text-center w-16 font-bold border-r border-white/20">L/P</th>
                       <th className="p-3 font-bold">Tempat, Tanggal Lahir</th>
                     </tr>
                   </thead>
                   <tbody className="divide-y divide-gray-200">
                     {dataToPrint.map((alumni, i) => (
                       <tr key={i} className={i % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                         <td className="p-3 text-center border-r border-gray-200 text-gray-600 font-medium">{i + 1}</td>
                         <td className="p-3 font-bold text-gray-800 border-r border-gray-200 uppercase">{alumni.nama}</td>
                         <td className="p-3 text-center border-r border-gray-200 text-gray-600">{alumni.nisn || '-'}</td>
                         <td className="p-3 text-center border-r border-gray-200 font-bold">{alumni.jk}</td>
                         <td className="p-3 text-gray-600">{alumni.tmptLahir}, {alumni.tglLahir}</td>
                       </tr>
                     ))}
                   </tbody>
                 </table>
              </div>
            )}
            
            {dataToPrint.length === 0 && <div className="text-center py-16 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 text-gray-500 font-bold mt-10">Belum ada data.</div>}
            
            <div className="mt-24 flex justify-end no-break">
              <div className="text-center w-72">
                <p className="mb-20 text-sm font-medium text-gray-700">Paguyaman, {new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric'})}<br/>Kepala Sekolah,</p>
                <p className="font-black text-gray-900 border-b border-gray-900 inline-block pb-1 px-4 mb-1 uppercase tracking-wide">Drs. H. Abdullah, M.Pd</p>
                <p className="text-xs text-gray-600 font-bold tracking-wider">NIP. 19700101 199512 1 001</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
